name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv venv --python 3.13
      - run: uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/pytest
      - run: .venv/bin/ruff check .
