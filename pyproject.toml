[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "dsa-agent"
version = "0.1.0"
description = "A data science agent whose sessions are append-only Jupyter notebooks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "ASSERT-KTH"}]
dependencies = [
    "agentknit>=0.1032.0,<1",
    "keyring>=25",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[project.scripts]
"dsa-agent" = "agent_kimi_k3_1_python_repl:main"

[project.urls]
Homepage = "https://github.com/ASSERT-KTH/dsa-agent"
Repository = "https://github.com/ASSERT-KTH/dsa-agent"

[tool.hatch.build.targets.wheel]
only-include = ["agent_kimi_k3_1_python_repl.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
